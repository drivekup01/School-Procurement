<style>@font-face{font-family:ths;src:url('./THSarabun.ttf')}*{box-sizing:border-box}body{margin:0;background:#edf2f8;color:#203246;font:15px system-ui,Tahoma,sans-serif}body > header{background:#143857;color:white;padding:14px 22px;display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}body > header a{color:#d8efff}h1{font-size:20px;margin:0}main{display:grid;grid-template-columns:minmax(420px,55%) minmax(330px,45%);gap:14px;padding:14px;min-height:calc(100vh - 72px)}.panel{background:white;border-radius:14px;box-shadow:0 2px 12px #1232;overflow:auto;max-height:calc(100vh - 97px)}.pane{padding:19px}h2{font-size:17px;margin:0 0 10px}.note{font-size:13px;color:#567;line-height:1.7}.alert{padding:12px;border-radius:8px;background:#fff4df;color:#734f18;margin:10px 0}.good{background:#e7f8ee;color:#175c33}.tabs{display:flex;flex-wrap:wrap;gap:5px;margin:12px 0}.tabs button{border:1px solid #c9d8e6;background:white;color:#204b69}.tabs button.active{background:#126ca5;color:white}.group{display:none}.group.active{display:block}.fields{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.field.wide{grid-column:1/-1}label{display:block;font-weight:600;font-size:13px;margin-bottom:5px}input,textarea,select{font:inherit;width:100%;padding:9px;border:1px solid #c3d1df;border-radius:7px;background:#fff}textarea{min-height:64px;resize:vertical}button{cursor:pointer;background:#126ca5;color:white;border:0;border-radius:8px;padding:9px 13px;font-weight:600}.secondary{background:#e5edf5;color:#22516e}.toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:15px 0}table{width:100%;border-collapse:collapse;font-size:13px}th,td{border:1px solid #bfccda;padding:6px;vertical-align:top}th{background:#edf3f8}td input{padding:5px;min-width:45px;font-size:13px}.scroll{overflow:auto}.total{font-size:19px;font-weight:bold}.status{font-size:12px}.muted{color:#718193}.rightsticky{position:sticky;top:0;background:white;padding:16px;bor /* --- Single source of truth: Preview paper/layout (2026-10-13) --- */
:root{--preview-paper-w:210mm;--preview-paper-h:297mm;--preview-top:5mm;--preview-bottom:10mm;--preview-left:22.5mm;--preview-right:13.5mm;--preview-blank:10pt}
.panel:nth-child(2) .pane{background:#e4eaf0;overflow:auto;min-height:0;padding:6px 8px}
.preview-zoom{display:flex;align-items:center;gap:4px}
.preview-zoom button{padding:4px 9px;min-width:25px}
.preview-zoom span{font-size:11px;min-width:36px;text-align:center}
.preview-zoom button:disabled{opacity:.35;cursor:default}
#previewPage{width:var(--preview-paper-w);height:var(--preview-paper-h);padding:var(--preview-top) var(--preview-right) var(--preview-bottom) var(--preview-left);box-sizing:border-box;background:white;position:relative;box-shadow:0 3px 12px #22334420;transform-origin:top left}
#preview{font-family:ths,'THSarabunPSK',serif;font-size:16pt;line-height:1.12;color:#111}
#preview h3{text-align:center;font-size:24pt;margin:0 0 1em}
#preview .line{padding:2mm 0}
#preview .memohead{position:relative;margin-bottom:1em}
#preview .memohead img{position:absolute;left:0;top:0;width:15mm;height:15mm;object-fit:contain}
#preview .memohead h3{margin:0;text-align:center;font-weight:700}
#preview .twocol{display:grid;grid-template-columns:1fr 1fr;gap:5mm}
#preview .doc-line{padding:2mm 0}
#preview .subject{border-bottom:1px solid #111;padding-bottom:2mm}
#preview .doc-body p{margin:4mm 0;text-indent:14mm;text-align:justify;overflow-wrap:anywhere}
#preview .signatures{display:grid;grid-template-columns:1fr 1fr;gap:10mm;margin-top:12mm}
#preview .approve{text-align:center;margin-top:18mm}
#preview .source-note{font-size:16pt;margin-top:11mm}
#docxPages{background:transparent;overflow:visible;padding:0}
#docxPages .docx-wrapper{width:var(--preview-paper-w)!important;min-width:var(--preview-paper-w)!important;max-width:var(--preview-paper-w)!important;display:block!important;background:transparent!important;padding:0!important}
#docxPages section.docx{width:var(--preview-paper-w)!important;min-width:var(--preview-paper-w)!important;max-width:var(--preview-paper-w)!important;height:var(--preview-paper-h)!important;min-height:var(--preview-paper-h)!important;max-height:var(--preview-paper-h)!important;box-sizing:border-box!important;padding:var(--preview-top) var(--preview-right) var(--preview-bottom) var(--preview-left)!important;margin:0!important;background:white!important;position:relative!important;overflow:visible!important;box-shadow:0 3px 12px #22334420!important;border:1px solid #d0d9e3!important}
#docxPages section.docx[style*="display: none"]{display:none!important}
#docxPages section.docx>header,#docxPages section.docx>footer{display:none!important}
#docxPages section.docx .docx-page-content{max-width:100%!important}
#docxPages .word-empty-spacer{height:var(--preview-blank)!important;min-height:var(--preview-blank)!important;max-height:var(--preview-blank)!important;line-height:var(--preview-blank)!important;margin:0!important;padding:0!important;border:0!important;box-sizing:border-box!important}
#docxPages .word-empty-spacer *{line-height:inherit!important}
#docxPages .docx-edit-field{display:inline-block!important;font-family:ths,'THSarabunPSK',serif!important;font-size:16pt!important;line-height:1!important;height:1.2em!important;min-width:28px!important;max-width:350px!important;padding:0 2px!important;margin:0!important;border:0!important;border-bottom:1px dashed #3185b9!important;vertical-align:baseline!important;box-sizing:border-box!important;background:#eaf6ff!important;color:#172c3f!important}
#docxPages .docx-edit-field:focus{outline:2px solid #2178b5!important;background:#fff!important}
#docxPages .page-overflow{outline:2px solid #c43d30!important}
#googleViewer{display:none!important}
#status,#pageAudit{display:none!important}
@media print{
 @page{size:A4;margin:0}
 .preview-zoom{display:none!important}
 #previewPage{transform:none!important;box-shadow:none!important;margin:0!important}
 #docxPages .docx-wrapper{transform:none!important;margin:0!important}
 #docxPages section.docx{border:0!important;box-shadow:none!important;break-after:page!important}
 #docxPages section.docx[style*="display: none"]{display:block!important}
 #docxPages .docx-edit-field{background:transparent!important;border:0!important}
 .panel:nth-child(2) .pane{background:white;overflow:visible;padding:0}
}

<header><h1>ฟอร์มชุดจัดซื้อจาก Word · ทดลอง</h1><a href="./html-a4-demo.html">กลับหน้าทดลอง A4</a></header>
<main><section class="panel"><div class="pane"><h2>กรอกข้อมูลกลางครั้งเดียว</h2><label for="pageSelector">เลือกส่วนของเอกสาร</label><select id="pageSelector"></select><details open style="margin:12px 0;padding:12px;background:#eef6fc;border-radius:8px"><summary style="cursor:pointer;font-weight:700">ข้อมูลที่ใช้ร่วมกันทุกหน้า</summary><div id="sharedFields" class="fields" style="margin-top:12px"></div></details><div id="groups"></div><div class="toolbar left-exports"><button id="export">ส่งออก Word (.docx)</button><button id="print" class="secondary">พิมพ์ / PDF</button><button id="save" class="secondary">บันทึกข้อมูล</button><button id="reset" class="secondary">ล้างข้อมูล</button></div></div></section>
<section class="panel"><div class="rightsticky"><div class="preview-heading"><h2>ตรวจสอบข้อมูล</h2><div class="preview-zoom"><button id="zoomOut" type="button" class="secondary" title="ย่อกระดาษ">−</button><span id="zoomLevel" aria-live="polite">พอดีหน้า</span><button id="zoomIn" type="button" class="secondary" title="ขยายกระดาษ">+</button><button id="zoomFit" type="button" class="secondary">พอดีหน้า</button><button id="prevPage" type="button" class="secondary">◀</button><span id="pageCount">1 / 1</span><button id="nextPage" type="button" class="secondary">▶</button></div></div><div id="status" class="alert" hidden>กำลังตรวจแม่แบบ Word…</div><div id="pageAudit" class="note" role="status" hidden></div></div><div class="pane"><div id="previewPage"><div id="preview"></div></div><div id="docxPages" hidden></div></div></section></main>
<script>
const definitions=[
{title:'ข้อมูลเอกสาร',fields:[['document_date','เลขที่หนังสือ'],['main_date','วันที่หลัก','date'],['requesting_unit','ฝ่ายงาน / กลุ่มสาระ'],['procurement_type','ประเภทจัดซื้อ/จัดจ้าง'],['budget_year','ปีงบประมาณ'],['project_name','ชื่อโครงการ','textarea'],['activity_name','ชื่อกิจกรรม','textarea'],['expense_description','รายการค่าใช้จ่าย'],['budget_amount','วงเงินงบประมาณ','number'],['budget_amount_text','วงเงินเป็นตัวอักษร'],['assigned_officer_name','ชื่อผู้ได้รับมอบหมาย'],['assigned_officer_position','ตำแหน่งผู้ได้รับมอบหมาย'],['officer_signer_name','ชื่อเจ้าหน้าที่'],['chief_officer_signer_name','ชื่อหัวหน้าเจ้าหน้าที่']]},
{title:'ขอบเขตงาน',fields:[['purchase_item','รายการจัดซื้อ'],['purchase_item_count','จำนวนรายการจัดซื้อ','number'],['hire_item','รายการจัดจ้าง'],['hire_job_count','จำนวนงานจ้าง','number'],['activity_date','วันที่จัดกิจกรรม','date'],['procurement_item_count','จำนวนรายการทั้งหมด','number'],['reference_price','ราคากลาง','number'],['delivery_location','สถานที่ส่งมอบ'],['price_validity_days','ระยะเวลายืนราคา (วัน)','number'],['delivery_days','ระยะเวลาส่งมอบ (วัน)','number']]},
{title:'รายงานขอซื้อ',fields:[['procurement_purpose','วัตถุประสงค์','textarea'],['procurement_reason','เหตุผลความจำเป็น','textarea'],['procurement_description','รายละเอียดซื้อ/จ้าง','textarea'],['required_within_days','ต้องการใช้ภายใน (วัน)','number']]},
{title:'ผู้ขายและสั่งซื้อ',fields:[['vendor_name','ชื่อร้านค้า/ผู้ขาย'],['agreed_price','ราคาที่ตกลง','number'],['agreed_price_text','ราคาที่ตกลงเป็นตัวอักษร'],['purchase_order_number','เลขที่ใบสั่งซื้อ'],['purchase_order_date','วันที่ใบสั่งซื้อ','date'],['purchase_report_number','เลขที่รายงานขอซื้อ'],['purchase_report_date','วันที่รายงานขอซื้อ','date']]},

const $=x=>document.getElementById(x),data=JSON.parse(localStorage.getItem('schoolProcurementDemoV1')||'{}');
function mkInput(k,label,type){let el=document.createElement('div');el.className='field'+(type==='textarea'?' wide':'');let l=document.createElement('label');l.textContent=label;let i=type==='textarea'?document.createElement('textarea'):document.createElement('input');if(type!=='textarea')i.type=type||'text';i.dataset.key=k;i.value=data[k]||'';i.addEventListener('input',refresh);el.append(l,i);return el}
const sharedKeys=new Set(['document_date','main_date','requesting_unit','procurement_type','budget_year','project_name','activity_name','expense_description','budget_amount','budget_amount_text','assigned_officer_name','assigned_officer_position','officer_signer_name','chief_officer_signer_name']);definitions.forEach((g,j)=>{const opt=document.createElement('option');opt.value=j;opt.textContent=g.title;$('pageSelector').append(opt);const wrap=document.createElement('div');wrap.className='group'+(j===0?' active':'');const body=document.createElement('div');body.className='fields';g.fields.forEach(f=>{if(sharedKeys.has(f[0])){if(!$('sharedFields').querySelector('[data-key="'+f[0]+'"]'))$('sharedFields').append(mkInput(...f))}else body.append(mkInput(...f))});wrap.append(body);$('groups').append(wrap)});
function choose(k){[...$('groups').children].forEach((e,j)=>e.classList.toggle('active',j===Number(k)))}$('pageSelector').onchange=e=>choose(e.target.value);
function fieldValues(){let o={};document.querySelectorAll('[data-key]').forEach(x=>o[x.dataset.key]=x.value);return o}

async function findTemplate(){const r=await fetch('./procurement-template13.docx',{cache:'no-store'});if(!r.ok)return null;const b=await r.arrayBuffer();try{const zip=new PizZip(b);const xml=zip.file('word/document.xml')?.asText()||'';if(!xml.includes('<w:document')&&!xml.includes(':document'))throw Error('ไฟล์ไม่ใช่เอกสาร Word ที่อ่านได้');return b}catch(e){throw Error('แม่แบบบน GitHub ไม่ตรงกับไฟล์ล่าสุด: '+e.message)}}

let renderToken=0;
function splitWordIntoPages(bytes){
 const zip=new PizZip(bytes.slice(0)),entry=zip.file('word/document.xml');
 if(!entry)return [bytes];
 const xml=new DOMParser().parseFromString(entry.asText(),'application/xml');
 const ns='http://schemas.openxmlformats.org/wordprocessingml/2006/main';
 const body=xml.getElementsByTagNameNS(ns,'body')[0];
 if(!body)return [bytes];
 const children=[...body.children],tail=children.find(x=>x.localName==='sectPr');
 const content=children.filter(x=>x!==tail);
 const pages=[[]];let hasExplicit=false;
 function newPage(){if(pages[pages.length-1].length)pages.push([])}
 const hasRenderedMark=node=>node.getElementsByTagNameNS(ns,'lastRenderedPageBreak').length>0;
 const hasHardPageBreak=node=>[...node.getElementsByTagNameNS(ns,'br')].some(e=>e.getAttributeNS(ns,'type')==='page');
 // Use Word's saved page markers only. Headings are never page boundaries.
 for(const node of content){
  const marked=hasRenderedMark(node)||hasHardPageBreak(node);
  // The known Word pagination markers precede the next page's content.
  if(marked)newPage();
  const copy=node.cloneNode(true);
  // Remove old renderer's pagination hint from each newly isolated Word part.
  for(const e of [...copy.getElementsByTagNameNS(ns,'lastRenderedPageBreak')])e.parentNode.removeChild(e);
  pages[pages.length-1].push(copy);
 }
 const groups=pages.filter(p=>p.length);
 if(groups.length<2)return [bytes];
 return groups.map(nodes=>{
  const x=new DOMParser().parseFromString(entry.asText(),'application/xml');
  const b=x.getElementsByTagNameNS(ns,'body')[0];
  while(b.firstChild)b.removeChild(b.firstChild);
  nodes.forEach(n=>b.appendChild(x.importNode(n,true)));
  if(tail)b.appendChild(x.importNode(tail,true));
  const z=new PizZip(bytes.slice(0));z.file('word/document.xml',new XMLSerializer().serializeToString(x));
  return z.generate({type:'arraybuffer'});
 });
}
function attachPreviewInputs(host){
 const values=fieldValues(),re=/«([a-zA-Z_][a-zA-Z_0-9]*)»/g;
 const walker=document.createTreeWalker(host,NodeFilter.SHOW_TEXT);
 const nodes=[];while(walker.nextNode())if(walker.currentNode.nodeValue.includes('«'))nodes.push(walker.currentNode);
 for(const node of nodes){
  const text=node.nodeValue,fragment=document.createDocumentFragment();let start=0,match;
  re.lastIndex=0;
  while((match=re.exec(text))){
   if(match.index>start)fragment.append(document.createTextNode(text.slice(start,match.index)));
   const key=match[1],input=document.createElement('input');
   input.type='text';input.className='docx-edit-field';input.dataset.previewKey=key;
   input.title='แก้ไข '+key;input.setAttribute('aria-label','แก้ไข '+key);
   input.value=String(values[key]??'');
   input.placeholder=key;
   const resize=()=>{const raw=input.value||input.placeholder;const measure=document.createElement('canvas').getContext('2d');measure.font='16pt ths, serif';input.style.width=Math.max(28,Math.min(350,Math.ceil(measure.measureText(raw).width)+14))+'px'};
   resize();
   input.addEventListener('input',()=>{
    resize();
    const matchInput=[...document.querySelectorAll('[data-key]')].filter(x=>x.dataset.key===key);
    matchInput.forEach(e=>{e.value=input.value});
    document.querySelectorAll('[data-preview-key]').forEach(e=>{if(e!==input&&e.dataset.previewKey===key)e.value=input.value});
    data[key]=input.value;localStorage.setItem('schoolProcurementDemoV1',JSON.stringify(data));
   });
   input.addEventListener('change',()=>{});
   fragment.append(input);start=re.lastIndex;
  }
  if(start){if(start<text.length)fragment.append(document.createTextNode(text.slice(start)));node.parentNode.replaceChild(fragment,node)}
 }
}
function normalizeBlankLineSpacing(host){
 // The 10pt rule is applied to empty Word paragraphs only, not to text or signatures.
 host.querySelectorAll('section.docx p').forEach(p=>{
  if(!p.textContent.trim()&&!p.querySelector('img,svg,table,input,object')){
   p.classList.add('word-empty-spacer');
  }
 });
}
function auditPageSpacing(host){
 // Read-only audit; never modify spacing again after the 10pt rule.
 const problems=[];
 [...host.querySelectorAll('section.docx')].forEach((page,i)=>{
  const bounds=page.getBoundingClientRect();
  const limit=bounds.bottom-(parseFloat(getComputedStyle(page).paddingBottom)||0);
  const visible=[...page.querySelectorAll('p,table')].filter(el=>el.getClientRects().length);
  const bottom=visible.reduce((v,el)=>Math.max(v,el.getBoundingClientRect().bottom),bounds.top);
  page.classList.toggle('page-overflow',bottom>limit+2);
  if(bottom>limit+2)problems.push('หน้า '+(i+1));
 });
 const msg=$('pageAudit');if(msg)msg.textContent=problems.length?'เนื้อหาล้นหน้าที่ '+problems.join(', '):'';
}

async function renderWordPages(blob,host,job){
 const bytes=await blob.arrayBuffer(),parts=splitWordIntoPages(bytes);
 if(job!==renderToken)return;
 const fragment=document.createDocumentFragment();
 for(let i=0;i<parts.length;i++){
  if(job!==renderToken)return;
  const destination=document.createElement('div');
  await window.docx.renderAsync(parts[i],destination,null,{inWrapper:true,breakPages:true,ignoreLastRenderedPageBreak:false});
  const sections=[...destination.querySelectorAll('section.docx')];
  for(const section of sections)fragment.appendChild(section);
 }
 if(job!==renderToken)return;
 host.replaceChildren();
 const wrapper=document.createElement('div');wrapper.className='docx-wrapper docx-split-wrapper';wrapper.appendChild(fragment);host.appendChild(wrapper);
 attachPreviewInputs(host);
 normalizeBlankLineSpacing(host);
 requestAnimationFrame(()=>{if(job===renderToken){showDocumentPage();auditPageSpacing(host)}});
 $('previewPage').style.display='none';host.style.display='block';
 currentPage=Math.min(currentPage,Math.max(0,host.querySelectorAll('section.docx').length-1));showDocumentPage();
 $('status').textContent='คลิกช่องพารามิเตอร์ในหน้า Word เพื่อแก้ค่าได้ (บันทึกเข้าฟอร์มและใช้ในการ Export) • แบ่งส่วนแสดง '+host.querySelectorAll('section.docx').length+' หน้า';
 $('status').className='alert good';
}

function setPreviewMode(){previewMode='word';$('docxPages').style.display='block';$('previewPage').style.display='none';showDocumentPage()}
let zoomFactor=1,zoomAuto=true,currentPage=0;
function showDocumentPage(){
 const host=$('docxPages'),pages=[...host.querySelectorAll('section.docx')];
 if(!pages.length){$('previewPage').style.display='block';$('pageCount').textContent='1 / 1';fitA4();return}
 currentPage=Math.max(0,Math.min(currentPage,pages.length-1));
 pages.forEach((p,i)=>p.style.display=i===currentPage?'block':'none');
 $('pageCount').textContent=(currentPage+1)+' / '+pages.length;
 $('prevPage').disabled=currentPage===0;
 $('nextPage').disabled=currentPage===pages.length-1;
 fitA4();
}
$('prevPage').onclick=()=>{currentPage--;showDocumentPage()};
$('nextPage').onclick=()=>{currentPage++;showDocumentPage()};
function fitA4(){if(previewMode==='google')return;
 const source=$('docxPages'),pane=document.querySelector('.panel:nth-child(2) .pane');
 const page=source&&!source.hidden?source.querySelector('section.docx:not([style*="display: none"])'):null;
 const active=page||$('previewPage');
 if(!active||!pane)return;
 const holder=page?source.querySelector('.docx-wrapper'):active;
 if(!holder)return;
 holder.style.transform='none';holder.style.marginLeft='0';holder.style.marginBottom='0';
 const w=active.offsetWidth,h=active.offsetHeight;
 const fit=Math.min(1,(pane.clientWidth-25)/w,(pane.clientHeight-30)/h);
 const scale=Math.max(.2,Math.min(2.5,zoomAuto?fit:fit*zoomFactor));
 holder.style.transform='scale('+scale+')';holder.style.transformOrigin='top left';
 holder.style.marginLeft=Math.max(0,(pane.clientWidth-w*scale)/2)+'px';
 holder.style.marginBottom=-(holder.offsetHeight*(1-scale))+15+'px';
 $('zoomLevel').textContent=Math.round(scale*100)+'%';
}
$('zoomOut').onclick=()=>{zoomAuto=false;zoomFactor=Math.max(.4,zoomFactor-.15);fitA4()};
$('zoomIn').onclick=()=>{zoomAuto=false;zoomFactor=Math.min(3,zoomFactor+.15);fitA4()};
$('zoomFit').onclick=()=>{zoomAuto=true;zoomFactor=1;fitA4()};
const previewPane=document.querySelector('.panel:nth-child(2) .pane');
previewPane.addEventListener('wheel',e=>{if(!e.ctrlKey)return;e.preventDefault();zoomAuto=false;zoomFactor=Math.max(.4,Math.min(3,zoomFactor+(e.deltaY<0?.12:-.12)));fitA4()},{passive:false});
window.addEventListener('resize',fitA4);window.addEventListener('load',fitA4);
const sheetWatcher=new ResizeObserver(()=>fitA4());sheetWatcher.observe(document.querySelector('.panel:nth-child(2) .pane'));
